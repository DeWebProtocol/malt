name: Go

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test and vet
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download modules
        run: go mod download

      - name: Run tests
        run: go test ./...

      - name: Run 32-bit commitment tests
        run: GOARCH=386 go test ./auth/commitment/kzg ./auth/commitment/ipa

      - name: Run verifier WASM conformance and Map-proof smoke
        run: sh scripts/test-verifier-wasm-vectors.sh

      - name: Run writer WASM smoke
        run: sh scripts/test-writer-wasm.sh

      - name: Run vet
        run: go vet ./...

      - name: Build SDK packages
        run: make build
